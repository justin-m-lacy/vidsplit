name: Build & Release App (pnpm)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ARTIFACT_DIR: release-artifacts

jobs:
  linux:
    name: Linux build & create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm (Corepack)
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Build Linux artifact
        run: pnpm run app:linux
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p "$ARTIFACT_DIR"
          shopt -s nullglob
          cp -v dist/*.deb dist/*.rpm dist/*.AppImage dist/*.snap dist/*.tar.gz "$ARTIFACT_DIR/" || true
        shell: bash

      - name: Create checksums
        run: |
          cd $ARTIFACT_DIR || exit 0
          if [ -n "$(ls -A . 2>/dev/null)" ]; then sha256sum * > checksums.txt || true; fi
        shell: bash

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ARTIFACT_DIR }}/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows build & upload
    runs-on: windows-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm (Corepack)
        run: corepack enable; corepack prepare pnpm@latest --activate
        shell: powershell

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: powershell

      - name: Build
        run: pnpm run build
        shell: powershell

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Verify NSIS
        run: |
          RefreshEnv
          $env:PATH = "$env:ALLUSERSPROFILE\chocolatey\bin;$env:PATH"
          makensis -VERSION
        shell: pwsh

      - name: Build Windows artifact
        run: pnpm run app:win
        shell: powershell

      - name: Collect artifacts
        run: |
          mkdir -p $env:ARTIFACT_DIR
          Copy-Item -Path dist\*.exe -Destination $env:ARTIFACT_DIR -Force -ErrorAction SilentlyContinue
        shell: powershell

      - name: Create checksums
        run: |
          Push-Location $env:ARTIFACT_DIR
          if (Get-ChildItem -File | Measure-Object).Count -gt 0 {
            Get-FileHash -Algorithm SHA256 * | ForEach-Object { "{0}  {1}" -f $_.Hash, $_.Path } | Out-File checksums.txt -Encoding utf8
          }
          Pop-Location
        shell: powershell

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v1
        with:
          files: $env:ARTIFACT_DIR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
